services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kv-proxy
    command: ["./proxy"]
    ports:
      - "8080:8080"
    networks:
      - kv-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  node-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kv-node-1
    command: ["./node", "-addr=:8081", "-id=node-1", "-proxy=http://proxy:8080"]
    ports:
      - "8081:8081"
    networks:
      - kv-network
    depends_on:
      proxy:
        condition: service_healthy

  node-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kv-node-2
    command: ["./node", "-addr=:8082", "-id=node-2", "-proxy=http://proxy:8080"]
    ports:
      - "8082:8082"
    networks:
      - kv-network
    depends_on:
      proxy:
        condition: service_healthy

  node-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kv-node-3
    command: ["./node", "-addr=:8083", "-id=node-3", "-proxy=http://proxy:8080"]
    ports:
      - "8083:8083"
    networks:
      - kv-network
    depends_on:
      proxy:
        condition: service_healthy

networks:
  kv-network:
    driver: bridge
